services:
  mysql:
    image: mysql:8.0
    container_name: oneyear-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oneyear}
      MYSQL_USER: ${MYSQL_USER:-oneyear}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oneyearpass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [oneyear]
    # No "ports:" needed - you'll read the data with `docker exec` in step 6.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oneyear-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-oneyear}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-oneyear}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-oneyearpass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8092
    ports:
      - "8092:8092"       # so you can curl/Postman it from your machine
    networks: [oneyear]

networks:
  oneyear:
    driver: bridge

volumes:
  mysql-data: